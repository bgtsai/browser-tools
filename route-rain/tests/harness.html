<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>RouteRain harness</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,"Noto Sans TC",sans-serif}
 canvas{position:absolute;left:0;top:0}
 .side{position:absolute;left:0;top:0;width:408px;height:100%;background:#fff;box-shadow:2px 0 6px rgba(0,0,0,.12)}
 .side.off{display:none}
 #toggle{position:absolute;top:420px;left:408px;width:23px;height:48px}
</style></head>
<body>
<canvas id="map"></canvas>
<!-- 模擬 Google 左側路線面板：class 與「選項」按鈕、收合鈕跟真的一樣 -->
<div class="m6QErb WNBkOb XiKgde side" id="side">
  <div style="padding:20px"><button id="opt">選項</button></div>
</div>
<button id="toggle" aria-label="收合側邊面板"></button>
<script>
 const cv=document.getElementById('map'); cv.width=innerWidth; cv.height=innerHeight;
 const g=cv.getContext('2d'); g.fillStyle='#f5f3ef'; g.fillRect(0,0,cv.width,cv.height);
 g.strokeStyle='#fff'; g.lineWidth=5; for(let i=0;i<16;i++){g.beginPath();g.moveTo(i*110,0);g.lineTo(i*110+80,cv.height);g.stroke();}
 g.strokeStyle='#1967d2'; g.lineWidth=11; g.lineJoin='round'; g.beginPath(); g.moveTo(300,262);
 [[372,250],[430,262],[505,300],[650,298],[800,298],[955,306],[1040,306]].forEach(p=>g.lineTo(...p)); g.stroke();
 document.getElementById('toggle').addEventListener('click',e=>{
   const b=e.currentTarget, side=document.getElementById('side');
   const collapse=b.getAttribute('aria-label')==='收合側邊面板';
   side.classList.toggle('off',collapse);
   b.setAttribute('aria-label', collapse?'展開側邊面板':'收合側邊面板');
   b.style.left = collapse? '0px':'408px';
 });
 // 假地圖：跟 Google 一樣，視野只從網址讀得到（這裡放在 #/@lat,lon,zoomz），
 // 而且拖動中不更新、放開後延遲才寫回（Google 實測約 0.5 秒）
 window.__map = { lat: 25.055, lon: 121.53, zoom: 15, delayMs: 300, drags: 0, wheels: 0, path: '/maps/dir/a/b' };
 const P = (lat, lon, z) => { const w = 256 * 2 ** z, s = Math.sin(lat * Math.PI / 180);
   return { x: (lon + 180) / 360 * w, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * w }; };
 const U = (x, y, z) => { const w = 256 * 2 ** z, n = Math.PI - 2 * Math.PI * y / w;
   return { lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))), lon: x / w * 360 - 180 }; };
 const writeUrl = () => { const m = __map; location.hash = `${m.path}/@${m.lat.toFixed(7)},${m.lon.toFixed(7)},${m.zoom.toFixed(2)}z`; };
 let urlTimer = null; const later = () => { clearTimeout(urlTimer); urlTimer = setTimeout(writeUrl, __map.delayMs); };
 window.__fakeMapOn = () => { writeUrl();
   let down = null;
   cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, c: P(__map.lat, __map.lon, __map.zoom) }; __map.drags++; });
   cv.addEventListener('pointermove', e => { if (!down || !e.buttons) return;
     const n = U(down.c.x - (e.clientX - down.x), down.c.y - (e.clientY - down.y), __map.zoom); __map.lat = n.lat; __map.lon = n.lon; });
   cv.addEventListener('pointerup', () => { down = null; later(); });
   cv.addEventListener('wheel', e => { __map.wheels++; __map.zoom += e.deltaY < 0 ? 0.32 : -0.32; later(); });
   // 鍵盤 +／-＝Google 原生一級縮放（v1.11.1 起腳本用這個）；wheels 計數＝縮放動作次數
   cv.addEventListener('keydown', e => { if (e.key !== '+' && e.key !== '-') return; __map.wheels++; __map.zoom += e.key === '+' ? 1 : -1; later(); });
 };
 // GM 替身
 window.__gm={};
 window.GM_getValue=(k,d)=> k in __gm ? __gm[k] : d;
 window.GM_setValue=(k,v)=>{__gm[k]=v;};
 window.GM_registerMenuCommand=()=>{}; window.GM_setClipboard=()=>{};
 window.GM_xmlhttpRequest=()=>{}; window.GM_getResourceText=()=>'{}';
 window.unsafeWindow=window;
</script>
</body></html>
